name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint, SQL parse, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check api/app tests scripts verify --select E,F,B --ignore E501,E402
      - run: python scripts/check_sql.py
      - run: python -m pytest tests --ignore=tests/ui --ignore=tests/integration

  ui:
    name: Browser tests (preview mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/ui
