<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · DetourAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{ --asphalt:#2B2F33; --ink:#2B2F33; --ink-2:#5B636B; --ground:#EEF0F1; --surface:#FFFFFF; --rule:#D5D9DC;
  --divert:#F2B705; --divert-ink:#1E1A05; --inform:#1456A8; --stop:#C8322B; --font:"Overpass","Segoe UI",system-ui,sans-serif; }
@media (prefers-color-scheme: dark){ :root{ color-scheme:dark; --ink:#ECEEEF; --ink-2:#A9B1B8; --ground:#23272B; --surface:#2E3338; --rule:#454C53; --inform:#4C8FE0; --stop:#E5665F; } }
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:400 15px/1.45 var(--font);color:var(--ink);background:var(--ground);display:grid;grid-template-rows:auto 1fr}
header{background:var(--asphalt);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.mark{width:26px;height:26px;border-radius:5px;background:var(--divert);display:grid;place-items:center}
main{display:grid;place-items:start center;padding:8vh 16px 24px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--inform);border-radius:3px;padding:20px}
h1{font-size:22px;font-weight:800;margin:0 0 4px} p{margin:0 0 14px;color:var(--ink-2)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input{font:inherit;color:inherit;width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
button{font:inherit;font-weight:600;margin-top:14px;width:100%;padding:11px 14px;border:0;border-radius:6px;background:var(--inform);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:default} :focus-visible{outline:3px solid var(--divert);outline-offset:2px}
.msg{margin-top:12px;font-weight:600;color:var(--stop)} .note{margin-top:14px;padding:10px 12px;background:var(--divert);color:var(--divert-ink);border-radius:3px;font-size:13.5px}
</style>
</head>
<body>
<header><span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 13V8a3 3 0 0 1 3-3h4V2l4 4-4 4V7H6a1 1 0 0 0-1 1v5z" fill="#1E1A05"/></svg></span>DetourAI</header>
<main>
  <form id="f" autocomplete="on">
    <h1>Sign in</h1>
    <p>The console, the road brief and the data behind them are for the people running this city's routes.</p>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Sign in</button>
    <div class="msg" id="msg" role="alert" hidden></div>
    <div class="note" id="default" hidden>This server still uses the password from the example settings file. Set <strong>ADMIN_TOKEN</strong> (or <strong>CONSOLE_PASSWORD</strong>) in <strong>.env</strong> and restart before anyone else can reach it.</div>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
const next = (() => { const n = new URLSearchParams(location.search).get("next") || "/console"; return n.startsWith("/") && !n.startsWith("//") ? n : "/console"; })();
fetch("/v1/session").then(r => r.json()).then(s => { if (s.signed_in) location.replace(next); $("default").hidden = !s.default_password; }).catch(() => {});
$("f").addEventListener("submit", async e => {
  e.preventDefault(); $("msg").hidden = true; $("go").disabled = true;
  try {
    const r = await fetch("/v1/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({password:$("pw").value})});
    if (r.ok) { location.replace(next); return; }
    $("msg").textContent = r.status === 429 ? "Too many wrong tries. Wait five minutes, then try again." : r.status === 401 ? "That password is not right." : "Sign-in failed. The server answered " + r.status + ".";
  } catch { $("msg").textContent = "The server cannot be reached. Is the stack running?"; }
  $("msg").hidden = false; $("go").disabled = false; $("pw").select();
});
</script>
</body>
</html>
