services:
  db:
    build: ./db
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_connections=200
      - -c
      - shared_buffers=4GB
      - -c
      - work_mem=256MB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - max_parallel_workers_per_gather=4
    environment:
      POSTGRES_USER: detour
      POSTGRES_PASSWORD: ${DB_PASSWORD:-detour}
      POSTGRES_DB: detour
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
      - ./import:/import:ro
      - ./data:/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detour -d detour"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 1g

  redpanda:
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - rpdata:/var/lib/redpanda/data

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://detour:${DB_PASSWORD:-detour}@db:5432/detour
      KAFKA_BOOTSTRAP: redpanda:9092
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}
      CITY_ID: "1"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-7b-instruct-q4}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets LLM_BASE_URL=http://host.docker.internal:8000 reach a model server on the host
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  dbdata:
  rpdata:
